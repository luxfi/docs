name: Docker

# Build + push the Lux docs image on the lux-apps self-hosted ARC pool
# (lux-apps-build, in-cluster on lux-k8s with a DinD sidecar). This repo
# lives under the lux-apps org, so the scale set bound to
# github.com/lux-apps serves it; the luxfi-bound `lux-build` pool does
# NOT (ARC routes by org, not labels). GitHub-hosted runners are
# billing-blocked, so `runs-on: lux-apps-build` is mandatory — ARC
# matches on the scale-set name, not the classic
# [self-hosted,linux,amd64] labels.
#
# Image name is ghcr.io/lux-apps/lux-docs — it matches this repo's path
# (lux-apps/lux-docs), so the live deployment (lux-ns/lux-docs,
# imagePullPolicy: Always) pulls it as :latest. Single-arch amd64: the
# base image ghcr.io/hanzoai/spa is amd64-only (hanzo ARC arm64 runners
# paused on DOKS), same constraint as the lux-apps marketing sites.
#
# The Dockerfile is self-contained (node:22-alpine build of apps/docs →
# static export → ghcr.io/hanzoai/spa). @hanzo/docs resolves from public
# npm. Because the image and this repo share the lux-apps org, the GHCR
# login uses the workflow's native GITHUB_TOKEN (packages: write, granted
# below) — no cross-org PAT. The package is private; the cluster pulls it
# with the lux-ns `ghcr-secret` imagePullSecret already on the Deployment.

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-docs
  cancel-in-progress: true

jobs:
  build:
    runs-on: lux-apps-build
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          driver-opts: |
            network=host

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/lux-apps/lux-docs
          # :latest tracks main (the deployment pins :latest), plus an
          # immutable :sha-<sha7> for traceability and a :{{version}} tag
          # on v* releases.
          flavor: |
            latest=true
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=sha-

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha,scope=lux-docs
          cache-to: type=gha,scope=lux-docs,mode=max
