name: Docker

# Build + push the Lux docs image on the lux-docs self-hosted ARC pool
# (lux-docs-build, in-cluster on lux-k8s with a DinD sidecar). This repo
# lives under the lux-docs org, so the org-level scale set bound to
# github.com/lux-docs serves it — and every other lux-docs repo, with no
# per-repo CI work. ARC routes by org / scale-set name, not by the classic
# [self-hosted,linux,amd64] labels, and GitHub-hosted runners are
# billing-blocked, so `runs-on: lux-docs-build` is mandatory.
#
# Image name is ghcr.io/lux-docs/network — it matches this repo's path
# (lux-docs/network), so the live deployment (lux-ns/lux-docs,
# imagePullPolicy: Always) pulls it as :latest. Single-arch amd64: the
# base image ghcr.io/hanzoai/spa is amd64-only (hanzo ARC arm64 runners
# paused on DOKS).
#
# The Dockerfile is self-contained (node:22-alpine build of apps/docs →
# static export → ghcr.io/hanzoai/spa). @hanzo/docs resolves from public
# npm. Because the image and this repo now share the lux-docs org, the
# GHCR login uses the workflow's native GITHUB_TOKEN (packages: write,
# granted below) — no cross-org PAT. The package is private; lux-ns pulls
# it via the `ghcr-lux-docs` imagePullSecret — a zeekay (org-owner)
# read:packages credential that covers EVERY lux-docs package, so future
# lux-docs sites need no new pull secret.

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-docs
  cancel-in-progress: true

jobs:
  build:
    runs-on: lux-docs-build
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          driver-opts: |
            network=host

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/lux-docs/network
          # :latest tracks main (the deployment pins :latest), plus an
          # immutable :sha-<sha7> for traceability and a :{{version}} tag
          # on v* releases.
          flavor: |
            latest=true
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=sha-

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha,scope=lux-docs
          cache-to: type=gha,scope=lux-docs,mode=max
